[package]
name = "dprint-plugin-typescript"
version = "0.96.1"
authors = ["David Sherret <dsherret@gmail.com>"]
edition = "2024"
homepage = "https://github.com/dprint/dprint-plugin-typescript"
keywords = ["formatting", "formatter", "typescript", "javascript"]
license = "MIT"
repository = "https://github.com/dprint/dprint-plugin-typescript"
description = "TypeScript and JavaScript code formatter."

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
opt-level = 3
debug = false
lto = true
debug-assertions = false
overflow-checks = false
panic = "abort"

[features]
wasm = ["serde_json", "dprint-core/wasm"]
tracing = ["dprint-core/tracing"]

[[test]]
name = "specs"
path = "tests/spec_test.rs"
harness = false

# zts fork: idempotence over the zts spec corpus. A normal harness test, unlike
# the spec runner above, because it asserts one property rather than collecting
# files.
[[test]]
name = "zts_idempotence"
path = "tests/zts_idempotence.rs"

[dependencies]
capacity_builder = "0.5.0"
# zts fork: local checkout of the ZesTTY deno_ast fork, a sibling of this repo.
# It is repointed at the swc fork (swc_rustify@zts) that carries the zts grammar
# and turns the zts syntax flag on. See that repo for why these are path deps
# rather than [patch.crates-io].
deno_ast = { path = "../deno_ast", features = ["view"] }
dprint-core = { version = "0.68.2", features = ["formatting"] }
dprint-core-macros = "0.1.0"
percent-encoding = "2.3.1"
rustc-hash = "2.1.1"
serde = { version = "1.0.144", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
thiserror = "2.0.18"

[dev-dependencies]
dprint-development = "0.10.1"
dprint-plugin-sql = "0.2.0"
malva = "0.11.2"
markup_fmt = "0.19.0"
pretty_assertions = "1.3.0"
serde_json = { version = "1.0" }
